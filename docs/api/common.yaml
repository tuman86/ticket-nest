# Shared building blocks for the TicketNest OpenAPI documents.
#
# This file is NOT a standalone API. It is a components library that
# auth-service.openapi.yaml and catalog-service.openapi.yaml reference with
#   $ref: './common.yaml#/components/<section>/<Name>'
#
# Conventions (apply to every service):
#   * Base path versioning:   /v1/...   (breaking changes => /v2)
#   * Errors:                 RFC 9457 application/problem+json
#   * Pagination:             cursor based, `limit` + `cursor` -> { data, page }
#   * JSON naming:            camelCase; timestamps RFC 3339 UTC; money in minor units (cents)
#   * Partial updates:        PATCH with application/merge-patch+json (RFC 7396)
#   * Optimistic concurrency: ETag on GET, optional If-Match on PATCH/PUT/DELETE
#   * Tracing:                X-Request-Id accepted and always echoed

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Short-lived (10 min) asymmetric JWT issued by the auth service.
        Verified by the gateway and again by each service (zero trust).
        Claims: `sub`, `role`, `permissions[]`, `tenantId` (operator users only).
        Guest-session and email-proof tokens are also bearer JWTs, with narrower
        claims (`sid` / `email` + `scope`).

  parameters:
    Limit:
      name: limit
      in: query
      description: Maximum number of items to return.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    Cursor:
      name: cursor
      in: query
      description: |
        Opaque cursor taken from `page.nextCursor` of the previous response.
        Treat as a black box; it is only valid for the same filters and expires
        after 24 hours.
      schema:
        type: string
        maxLength: 512
    IfMatch:
      name: If-Match
      in: header
      description: |
        ETag from a previous GET. When present and stale the server answers
        `412 Precondition Failed` instead of overwriting a concurrent change.
      schema:
        type: string
    RequestId:
      name: X-Request-Id
      in: header
      description: |
        Caller-supplied correlation id (UUID). Generated by the gateway when
        absent. Always echoed on the response and logged as `correlationId`.
      schema:
        type: string
        format: uuid

  headers:
    XRequestId:
      description: Correlation id of this request.
      schema:
        type: string
        format: uuid
    ETag:
      description: Entity tag of the returned representation (use with `If-Match`).
      schema:
        type: string
    RetryAfter:
      description: Seconds to wait before retrying.
      schema:
        type: integer
        minimum: 0
    RateLimitLimit:
      description: Requests allowed in the current window.
      schema:
        type: integer
    RateLimitRemaining:
      description: Requests left in the current window.
      schema:
        type: integer
    RateLimitReset:
      description: Seconds until the window resets.
      schema:
        type: integer
    Location:
      description: URL of the created resource.
      schema:
        type: string
        format: uri-reference

  schemas:
    Id:
      type: string
      format: uuid
      description: Opaque resource identifier.

    Timestamp:
      type: string
      format: date-time
      description: RFC 3339 timestamp in UTC.

    Email:
      type: string
      format: email
      maxLength: 254

    PhoneE164:
      type: string
      pattern: '^\+[1-9][0-9]{7,14}$'
      description: Phone number in E.164 format.
      examples:
        - '+919876543210'

    Money:
      type: object
      description: Monetary amount in the smallest currency unit. Never a float.
      required: [amountMinor, currency]
      properties:
        amountMinor:
          type: integer
          minimum: 0
          description: Amount in minor units (cents for USD).
        currency:
          type: string
          enum: [USD]
          default: USD
      examples:
        - amountMinor: 2500
          currency: USD

    Page:
      type: object
      description: Cursor pagination metadata.
      required: [limit, nextCursor, hasMore]
      properties:
        limit:
          type: integer
          description: Page size applied to this response.
        nextCursor:
          type: [string, 'null']
          description: Pass as `cursor` to fetch the next page. `null` on the last page.
        hasMore:
          type: boolean

    Problem:
      type: object
      description: |
        RFC 9457 problem details. Served as `application/problem+json`.

        `type` is a stable URI under `https://api.ticketnest.example/problems/`
        that identifies the problem class; clients should switch on `type` or
        `code`, never on `title` or `detail`.

        | type (suffix)          | status | meaning |
        |------------------------|--------|---------|
        | `malformed-request`    | 400 | body is not parseable or a parameter has the wrong type |
        | `unauthenticated`      | 401 | missing, expired, or invalid credentials |
        | `forbidden`            | 403 | authenticated but lacks the permission or tenant scope |
        | `not-found`            | 404 | no such resource, or it belongs to another tenant |
        | `conflict`             | 409 | request conflicts with current state |
        | `precondition-failed`  | 412 | `If-Match` did not match the current ETag |
        | `validation-error`     | 422 | well-formed but semantically invalid; see `errors` |
        | `rate-limited`         | 429 | too many requests; see `Retry-After` |
        | `internal-error`       | 500 | unexpected failure |
        | `unavailable`          | 503 | dependency down or overloaded; safe to retry |

        Each service adds domain-specific types (for example
        `invalid-credentials`, `schedule-has-bookings`); they are listed in that
        service's spec.
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri
          default: 'about:blank'
          examples:
            - https://api.ticketnest.example/problems/not-found
        title:
          type: string
          description: Short, human-readable summary of the problem class.
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
          description: Human-readable explanation specific to this occurrence.
        instance:
          type: string
          format: uri-reference
          description: URI reference identifying this occurrence (usually the request path).
        code:
          type: string
          description: Stable machine-readable code, SCREAMING_SNAKE_CASE.
          examples:
            - NOT_FOUND
        correlationId:
          type: string
          description: Value of `X-Request-Id` for support and log lookup.
      additionalProperties: true

    ValidationProblem:
      description: Problem with per-field validation details.
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          required: [errors]
          properties:
            errors:
              type: array
              minItems: 1
              items:
                $ref: '#/components/schemas/FieldError'

    FieldError:
      type: object
      required: [pointer, code, detail]
      properties:
        pointer:
          type: string
          description: JSON Pointer (RFC 6901) to the offending part of the request body, or `#/query/<name>` / `#/path/<name>` for parameters.
          examples:
            - '#/email'
        code:
          type: string
          description: Stable code such as `REQUIRED`, `TOO_SHORT`, `INVALID_FORMAT`, `OUT_OF_RANGE`.
        detail:
          type: string

  responses:
    BadRequest:
      description: Malformed request (unparseable JSON, wrong parameter type).
      headers:
        X-Request-Id: { $ref: '#/components/headers/XRequestId' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: https://api.ticketnest.example/problems/malformed-request
            title: Malformed request
            status: 400
            detail: Request body is not valid JSON.
            code: MALFORMED_REQUEST
            instance: /v1/example
            correlationId: 3f6f4c0e-6a58-4a6b-9a1e-2b3d9c1f0a77

    Unauthorized:
      description: Missing, expired, or invalid access token.
      headers:
        X-Request-Id: { $ref: '#/components/headers/XRequestId' }
        WWW-Authenticate:
          description: Bearer challenge (RFC 6750).
          schema: { type: string }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: https://api.ticketnest.example/problems/unauthenticated
            title: Authentication required
            status: 401
            detail: Access token is missing or has expired.
            code: UNAUTHENTICATED
            instance: /v1/example
            correlationId: 3f6f4c0e-6a58-4a6b-9a1e-2b3d9c1f0a77

    Forbidden:
      description: Authenticated, but the token lacks the required permission or tenant scope.
      headers:
        X-Request-Id: { $ref: '#/components/headers/XRequestId' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: https://api.ticketnest.example/problems/forbidden
            title: Forbidden
            status: 403
            detail: Missing permission `inventory:create`.
            code: FORBIDDEN
            instance: /v1/example
            correlationId: 3f6f4c0e-6a58-4a6b-9a1e-2b3d9c1f0a77

    NotFound:
      description: |
        Resource does not exist, or belongs to another tenant (the two are
        deliberately indistinguishable to avoid leaking existence).
      headers:
        X-Request-Id: { $ref: '#/components/headers/XRequestId' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: https://api.ticketnest.example/problems/not-found
            title: Resource not found
            status: 404
            detail: No resource with the given id.
            code: NOT_FOUND
            instance: /v1/example/0b1f7c3e-0c5b-4a76-9d51-5f2c0e8f9a11
            correlationId: 3f6f4c0e-6a58-4a6b-9a1e-2b3d9c1f0a77

    Conflict:
      description: The request conflicts with the current state of the resource.
      headers:
        X-Request-Id: { $ref: '#/components/headers/XRequestId' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: https://api.ticketnest.example/problems/conflict
            title: Conflict
            status: 409
            detail: The resource is in a state that does not allow this operation.
            code: CONFLICT
            instance: /v1/example
            correlationId: 3f6f4c0e-6a58-4a6b-9a1e-2b3d9c1f0a77

    PreconditionFailed:
      description: '`If-Match` did not match the current ETag; re-fetch and retry.'
      headers:
        X-Request-Id: { $ref: '#/components/headers/XRequestId' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: https://api.ticketnest.example/problems/precondition-failed
            title: Precondition failed
            status: 412
            detail: The resource was modified since it was read.
            code: PRECONDITION_FAILED
            instance: /v1/example/0b1f7c3e-0c5b-4a76-9d51-5f2c0e8f9a11
            correlationId: 3f6f4c0e-6a58-4a6b-9a1e-2b3d9c1f0a77

    ValidationError:
      description: Request is well-formed but fails validation.
      headers:
        X-Request-Id: { $ref: '#/components/headers/XRequestId' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ValidationProblem' }
          example:
            type: https://api.ticketnest.example/problems/validation-error
            title: Validation failed
            status: 422
            detail: One or more fields are invalid.
            code: VALIDATION_ERROR
            instance: /v1/example
            correlationId: 3f6f4c0e-6a58-4a6b-9a1e-2b3d9c1f0a77
            errors:
              - pointer: '#/email'
                code: INVALID_FORMAT
                detail: Must be a valid email address.

    TooManyRequests:
      description: Rate limit exceeded.
      headers:
        X-Request-Id: { $ref: '#/components/headers/XRequestId' }
        Retry-After: { $ref: '#/components/headers/RetryAfter' }
        RateLimit-Limit: { $ref: '#/components/headers/RateLimitLimit' }
        RateLimit-Remaining: { $ref: '#/components/headers/RateLimitRemaining' }
        RateLimit-Reset: { $ref: '#/components/headers/RateLimitReset' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: https://api.ticketnest.example/problems/rate-limited
            title: Too many requests
            status: 429
            detail: Rate limit exceeded. Retry after 30 seconds.
            code: RATE_LIMITED
            instance: /v1/example
            correlationId: 3f6f4c0e-6a58-4a6b-9a1e-2b3d9c1f0a77

    InternalError:
      description: Unexpected server error. Safe to report with the `correlationId`.
      headers:
        X-Request-Id: { $ref: '#/components/headers/XRequestId' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: https://api.ticketnest.example/problems/internal-error
            title: Internal server error
            status: 500
            code: INTERNAL_ERROR
            instance: /v1/example
            correlationId: 3f6f4c0e-6a58-4a6b-9a1e-2b3d9c1f0a77

    ServiceUnavailable:
      description: Service or a dependency is temporarily unavailable. Retry with backoff.
      headers:
        X-Request-Id: { $ref: '#/components/headers/XRequestId' }
        Retry-After: { $ref: '#/components/headers/RetryAfter' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: https://api.ticketnest.example/problems/unavailable
            title: Service unavailable
            status: 503
            code: UNAVAILABLE
            instance: /v1/example
            correlationId: 3f6f4c0e-6a58-4a6b-9a1e-2b3d9c1f0a77
