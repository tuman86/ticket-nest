        '403': { $ref: './common.yaml#/components/responses/Forbidden' }
        '404': { $ref: './common.yaml#/components/responses/NotFound' }
        '409': { $ref: './common.yaml#/components/responses/Conflict' }
        '412': { $ref: './common.yaml#/components/responses/PreconditionFailed' }
        '422': { $ref: './common.yaml#/components/responses/ValidationError' }
        '500': { $ref: './common.yaml#/components/responses/InternalError' }
    delete:
      tags: [Buses and trains]
      operationId: deleteCoachLayout
      summary: Delete a coach layout
      description: Fails with `resource-in-use` if any train references it.
      x-permissions: ['inventory:delete']
      parameters:
        - $ref: './common.yaml#/components/parameters/IfMatch'
      responses:
        '204': { description: Deleted. }
        '401': { $ref: './common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './common.yaml#/components/responses/Forbidden' }
        '404': { $ref: './common.yaml#/components/responses/NotFound' }
        '409': { $ref: './common.yaml#/components/responses/Conflict' }
        '412': { $ref: './common.yaml#/components/responses/PreconditionFailed' }
        '500': { $ref: './common.yaml#/components/responses/InternalError' }

  /v1/trains:
    get:
      tags: [Buses and trains]
      operationId: listTrains
      summary: List trains
      description: Ordered by `number`, then `id`.
      security: [{}, { bearerAuth: [] }]
      parameters:
        - $ref: './common.yaml#/components/parameters/Limit'
        - $ref: './common.yaml#/components/parameters/Cursor'
        - $ref: '#/components/parameters/OperatorIdFilter'
        - name: q
          in: query
          description: Number or name prefix.
          schema: { type: string, minLength: 2, maxLength: 50 }
      responses:
        '200':
          description: A page of trains.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TrainList' }
        '400': { $ref: './common.yaml#/components/responses/BadRequest' }
        '500': { $ref: './common.yaml#/components/responses/InternalError' }
    post:
      tags: [Buses and trains]
      operationId: createTrain
      summary: Create a train
      description: Binds a train number to a `TRAIN` route and a coach composition.
      x-permissions: ['inventory:create']
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateTrain' }
      responses:
        '201':
          description: Train created.
          headers:
            Location: { $ref: './common.yaml#/components/headers/Location' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Train' }
        '400': { $ref: './common.yaml#/components/responses/BadRequest' }
        '401': { $ref: './common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './common.yaml#/components/responses/Forbidden' }
        '409':
          description: '`duplicate-resource` (train number taken).'
          content:
            application/problem+json:
              schema: { $ref: './common.yaml#/components/schemas/Problem' }
        '422': { $ref: './common.yaml#/components/responses/ValidationError' }
        '500': { $ref: './common.yaml#/components/responses/InternalError' }

  /v1/trains/{trainId}:
    parameters:
      - $ref: '#/components/parameters/TrainId'
    get:
      tags: [Buses and trains]
      operationId: getTrain
      summary: Get a train
      security: [{}, { bearerAuth: [] }]
      responses:
        '200':
          description: The train.
          headers:
            ETag: { $ref: './common.yaml#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Train' }
        '404': { $ref: './common.yaml#/components/responses/NotFound' }
        '500': { $ref: './common.yaml#/components/responses/InternalError' }
    patch:
      tags: [Buses and trains]
      operationId: updateTrain
      summary: Update a train
      description: '`coaches`, when present, replaces the list. Rejected with `schedule-has-bookings` once a published run uses the train.'
      x-permissions: ['inventory:update']
      parameters:
        - $ref: './common.yaml#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema: { $ref: '#/components/schemas/UpdateTrain' }
      responses:
        '200':
          description: Updated train.
          headers:
            ETag: { $ref: './common.yaml#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Train' }
        '400': { $ref: './common.yaml#/components/responses/BadRequest' }
        '401': { $ref: './common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './common.yaml#/components/responses/Forbidden' }
        '404': { $ref: './common.yaml#/components/responses/NotFound' }
        '409': { $ref: './common.yaml#/components/responses/Conflict' }
        '412': { $ref: './common.yaml#/components/responses/PreconditionFailed' }
        '422': { $ref: './common.yaml#/components/responses/ValidationError' }
        '500': { $ref: './common.yaml#/components/responses/InternalError' }
    delete:
      tags: [Buses and trains]
      operationId: deleteTrain
      summary: Delete a train
      description: Fails with `resource-in-use` if any schedule references it.
      x-permissions: ['inventory:delete']
      parameters:
        - $ref: './common.yaml#/components/parameters/IfMatch'
      responses:
        '204': { description: Deleted. }
        '401': { $ref: './common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './common.yaml#/components/responses/Forbidden' }
        '404': { $ref: './common.yaml#/components/responses/NotFound' }
        '409': { $ref: './common.yaml#/components/responses/Conflict' }
        '412': { $ref: './common.yaml#/components/responses/PreconditionFailed' }
        '500': { $ref: './common.yaml#/components/responses/InternalError' }

  # ----------------------------------------------------------- operators ---
  /v1/operators:
    get:
      tags: [Operators]
      operationId: listOperators
      summary: List operators (tenants)
      description: Ordered by `name`, then `id`.
      x-permissions: ['operator:manage']
      parameters:
        - $ref: './common.yaml#/components/parameters/Limit'
        - $ref: './common.yaml#/components/parameters/Cursor'
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/OperatorStatus' }
        - name: vertical
          in: query
          schema: { $ref: '#/components/schemas/Vertical' }
      responses:
        '200':
          description: A page of operators.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OperatorList' }
        '400': { $ref: './common.yaml#/components/responses/BadRequest' }
        '401': { $ref: './common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './common.yaml#/components/responses/Forbidden' }
        '500': { $ref: './common.yaml#/components/responses/InternalError' }
    post:
      tags: [Operators]
      operationId: createOperator
      summary: Onboard an operator
      description: |
        Admin-only (no self-signup). Afterwards create operator users in the auth
        service with `tenantId` set to the returned `id`.
      x-permissions: ['operator:manage']
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateOperator' }
      responses:
        '201':
          description: Operator created.
          headers:
            Location: { $ref: './common.yaml#/components/headers/Location' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Operator' }
        '400': { $ref: './common.yaml#/components/responses/BadRequest' }
        '401': { $ref: './common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './common.yaml#/components/responses/Forbidden' }
        '422': { $ref: './common.yaml#/components/responses/ValidationError' }
        '500': { $ref: './common.yaml#/components/responses/InternalError' }

  /v1/operators/{operatorId}:
    parameters:
      - $ref: '#/components/parameters/OperatorId'
    get:
      tags: [Operators]
      operationId: getOperator
      summary: Get an operator
      description: Operators can read their own record.
      x-permissions: ['operator:manage', 'operator:read:own']
      responses:
        '200':
          description: The operator.
          headers:
            ETag: { $ref: './common.yaml#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Operator' }
        '401': { $ref: './common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './common.yaml#/components/responses/Forbidden' }
        '404': { $ref: './common.yaml#/components/responses/NotFound' }
        '500': { $ref: './common.yaml#/components/responses/InternalError' }
    patch:
      tags: [Operators]
      operationId: updateOperator
      summary: Update or suspend an operator
      description: Suspending an operator hides its published schedules from search and blocks new publishes; existing bookings are unaffected.
      x-permissions: ['operator:manage']
      parameters:
        - $ref: './common.yaml#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema: { $ref: '#/components/schemas/UpdateOperator' }
      responses:
        '200':
          description: Updated operator.
          headers:
            ETag: { $ref: './common.yaml#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Operator' }
        '400': { $ref: './common.yaml#/components/responses/BadRequest' }
        '401': { $ref: './common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './common.yaml#/components/responses/Forbidden' }
        '404': { $ref: './common.yaml#/components/responses/NotFound' }
        '412': { $ref: './common.yaml#/components/responses/PreconditionFailed' }
        '422': { $ref: './common.yaml#/components/responses/ValidationError' }
        '500': { $ref: './common.yaml#/components/responses/InternalError' }

  # --------------------------------------------------------- policy & fee ---
  /v1/cancellation-policies:
    get:
      tags: [Policy and fees]
      operationId: listCancellationPolicies
      summary: List cancellation policy versions
      description: |
        Policies are immutable and versioned. Resolution order for a schedule:
        the operator's active policy for that vertical, otherwise the platform
        default. Ordered by `createdAt` descending, then `id`.
      security: [{}, { bearerAuth: [] }]
      parameters:
        - $ref: './common.yaml#/components/parameters/Limit'
        - $ref: './common.yaml#/components/parameters/Cursor'
        - name: vertical
          in: query
          schema: { $ref: '#/components/schemas/Vertical' }
        - name: scope
          in: query
          schema: { $ref: '#/components/schemas/PolicyScope' }
        - $ref: '#/components/parameters/OperatorIdFilter'
        - name: activeOnly
          in: query
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: A page of policies.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CancellationPolicyList' }
        '400': { $ref: './common.yaml#/components/responses/BadRequest' }
        '500': { $ref: './common.yaml#/components/responses/InternalError' }
    post:
      tags: [Policy and fees]
      operationId: createCancellationPolicy
      summary: Publish a new policy version
      description: |
        Creates a new version for a vertical, either platform-wide
        (`operatorId` omitted or `null`) or as an operator override, and
        supersedes the previous active version. Existing bookings keep the policy
        snapshot taken when they were held.
      x-permissions: ['policy:manage']
      x-recent-login: true
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateCancellationPolicy' }
            examples:
              movies:
                summary: Platform default for movies
                value:
                  vertical: MOVIE
                  tiers:
                    - { minHoursBeforeStart: 4, refundBasisPoints: 10000 }
                    - { minHoursBeforeStart: 1, refundBasisPoints: 5000 }
                    - { minHoursBeforeStart: 0, refundBasisPoints: 0 }
      responses:
        '201':
          description: Policy version created.
          headers:
            Location: { $ref: './common.yaml#/components/headers/Location' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CancellationPolicy' }
        '400': { $ref: './common.yaml#/components/responses/BadRequest' }
        '401': { $ref: './common.yaml#/components/responses/ReauthenticationRequired' }
        '403': { $ref: './common.yaml#/components/responses/Forbidden' }
        '404':
          description: The referenced operator does not exist.
          content:
            application/problem+json:
              schema: { $ref: './common.yaml#/components/schemas/Problem' }
        '422':
          description: Validation error, including `invalid-policy-tiers`.
          content:
            application/problem+json:
              schema: { $ref: './common.yaml#/components/schemas/ValidationProblem' }
        '500': { $ref: './common.yaml#/components/responses/InternalError' }

  /v1/cancellation-policies/{policyId}:
    get:
      tags: [Policy and fees]
      operationId: getCancellationPolicy
      summary: Get a policy version
      security: [{}, { bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/PolicyId'
      responses:
        '200':
          description: The policy version.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CancellationPolicy' }
        '404': { $ref: './common.yaml#/components/responses/NotFound' }
        '500': { $ref: './common.yaml#/components/responses/InternalError' }

  /v1/fee-config:
    get:
      tags: [Policy and fees]
      operationId: getFeeConfig
      summary: Get the convenience fee configuration
      security: [{}, { bearerAuth: [] }]
      responses:
        '200':
          description: Current configuration.
          headers:
            ETag: { $ref: './common.yaml#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FeeConfig' }
        '500': { $ref: './common.yaml#/components/responses/InternalError' }
    put:
      tags: [Policy and fees]
      operationId: replaceFeeConfig
      summary: Replace the convenience fee configuration
      description: |
        Applies to schedules published afterwards; the fee in force is frozen
        onto each schedule at publish time. The fee is **not refundable** on a
        customer cancellation and **fully refunded** on operator cancellation.
      x-permissions: ['fee:manage']
      parameters:
        - $ref: './common.yaml#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateFeeConfig' }
      responses:
        '200':
          description: Updated configuration.
          headers:
            ETag: { $ref: './common.yaml#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FeeConfig' }
        '400': { $ref: './common.yaml#/components/responses/BadRequest' }
        '401': { $ref: './common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './common.yaml#/components/responses/Forbidden' }
        '412': { $ref: './common.yaml#/components/responses/PreconditionFailed' }
        '422': { $ref: './common.yaml#/components/responses/ValidationError' }
        '500': { $ref: './common.yaml#/components/responses/InternalError' }

components:
  securitySchemes:
    bearerAuth:
      $ref: './common.yaml#/components/securitySchemes/bearerAuth'

  parameters:
    ScheduleId: { name: scheduleId, in: path, required: true, schema: { $ref: './common.yaml#/components/schemas/Id' } }
    MovieId: { name: movieId, in: path, required: true, schema: { $ref: './common.yaml#/components/schemas/Id' } }
    VenueId: { name: venueId, in: path, required: true, schema: { $ref: './common.yaml#/components/schemas/Id' } }
    ScreenId: { name: screenId, in: path, required: true, schema: { $ref: './common.yaml#/components/schemas/Id' } }
    StationId: { name: stationId, in: path, required: true, schema: { $ref: './common.yaml#/components/schemas/Id' } }
    RouteId: { name: routeId, in: path, required: true, schema: { $ref: './common.yaml#/components/schemas/Id' } }
    BusLayoutId: { name: busLayoutId, in: path, required: true, schema: { $ref: './common.yaml#/components/schemas/Id' } }
    CoachLayoutId: { name: coachLayoutId, in: path, required: true, schema: { $ref: './common.yaml#/components/schemas/Id' } }
    TrainId: { name: trainId, in: path, required: true, schema: { $ref: './common.yaml#/components/schemas/Id' } }
    OperatorId: { name: operatorId, in: path, required: true, schema: { $ref: './common.yaml#/components/schemas/Id' } }
    PolicyId: { name: policyId, in: path, required: true, schema: { $ref: './common.yaml#/components/schemas/Id' } }

    OperatorIdFilter:
      name: operatorId
      in: query
      description: Filter by operator. Operator users are always limited to their own tenant.
      schema: { $ref: './common.yaml#/components/schemas/Id' }
    MovieIdFilter:
      name: movieId
      in: query
      schema: { $ref: './common.yaml#/components/schemas/Id' }
    City:
      name: city
      in: query
      description: Exact, case-insensitive city name. For bus and train schedules it matches the origin.
      schema: { type: string, maxLength: 100 }
    FromStationId:
      name: fromStationId
      in: query
      description: Boarding station. With `toStationId`, matches schedules whose route visits both in that order.
      schema: { $ref: './common.yaml#/components/schemas/Id' }
    ToStationId:
      name: toStationId
      in: query
      description: Alighting station.
      schema: { $ref: './common.yaml#/components/schemas/Id' }
    Date:
      name: date
      in: query
      description: Local calendar date at the origin (venue or boarding station timezone).
      schema: { type: string, format: date }
    ClassCode:
      name: classCode
      in: query
      description: Train class, e.g. `SL`, `3A`, `2A`, `1A`.
      schema: { $ref: '#/components/schemas/ClassCode' }
    PriceMinMinor:
      name: priceMinMinor
      in: query
      description: Lowest fare in minor units.
      schema: { type: integer, minimum: 0 }
    PriceMaxMinor:
      name: priceMaxMinor
      in: query
      description: Highest fare in minor units.
      schema: { type: integer, minimum: 0 }

  schemas:
    # ---------------------------------------------------------- primitives --
    Vertical:
      type: string
      enum: [MOVIE, BUS, TRAIN]
    TransportMode:
      type: string
      enum: [BUS, TRAIN]
    ClassCode:
      type: string
      pattern: '^[A-Z0-9]{1,4}$'
      examples: [SL, 3A, 2A, 1A]
    Timezone:
      type: string
      description: IANA timezone.
      examples: [Asia/Kolkata]
    Address:
      type: object
      required: [line1, city, state, postalCode, country]
      properties:
        line1: { type: string, maxLength: 200 }
        line2: { type: string, maxLength: 200 }
        city: { type: string, maxLength: 100 }
        state: { type: string, maxLength: 100 }
        postalCode: { type: string, maxLength: 20 }
        country: { type: string, pattern: '^[A-Z]{2}$', default: IN, description: ISO 3166-1 alpha-2. }
    GeoPoint:
      type: object
      required: [latitude, longitude]
      properties:
        latitude: { type: number, minimum: -90, maximum: 90 }
        longitude: { type: number, minimum: -180, maximum: 180 }

    # -------------------------------------------------------------- layout --
    SeatType:
      type: string
      description: |
        `STANDARD` for cinema seats; `SEATER` / `SLEEPER` for buses; berth types
        for trains. No price-tier types in the MVP.
      enum: [STANDARD, SEATER, SLEEPER, BERTH_LOWER, BERTH_MIDDLE, BERTH_UPPER, SIDE_LOWER, SIDE_UPPER]
    Seat:
      type: object
      required: [id, row, column, type]
      additionalProperties: false
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 8
          description: Label shown to users, unique within the layout (`A1`, `L12`, `S3`).
        row: { type: integer, minimum: 0 }
        column: { type: integer, minimum: 0 }
        deck:
          type: string
          enum: [LOWER, UPPER]
          default: LOWER
        type: { $ref: '#/components/schemas/SeatType' }
        reservedFor:
          type: [string, 'null']
          enum: [WOMEN, null]
          description: '`WOMEN` seats can only be booked for a female passenger (bus only).'
    SeatLayout:
      type: object
      required: [rows, columns, seats]
      additionalProperties: false
      properties:
        rows: { type: integer, minimum: 1, maximum: 100 }
        columns: { type: integer, minimum: 1, maximum: 100 }
        seats:
          type: array
          minItems: 1
          maxItems: 1000
          items: { $ref: '#/components/schemas/Seat' }
      description: Grid geometry. Seat ids must be unique and positions inside the grid, otherwise `invalid-layout`.

    # ------------------------------------------------------------ operators --
    OperatorStatus:
      type: string
      enum: [ACTIVE, SUSPENDED]
    OperatorSummary:
      type: object
      required: [id, name]
      properties:
        id: { $ref: './common.yaml#/components/schemas/Id' }
        name: { type: string }
    Operator:
      type: object
      required: [id, name, legalName, contactEmail, verticals, status, version, createdAt, updatedAt]
      properties:
        id: { $ref: './common.yaml#/components/schemas/Id' }
        name: { type: string }
        legalName: { type: string }
        contactEmail: { $ref: './common.yaml#/components/schemas/Email' }
        contactPhone: { $ref: './common.yaml#/components/schemas/PhoneE164' }
        verticals:
          type: array
          uniqueItems: true
          minItems: 1
          items: { $ref: '#/components/schemas/Vertical' }
        status: { $ref: '#/components/schemas/OperatorStatus' }
        version: { type: integer, readOnly: true }
        createdAt: { $ref: './common.yaml#/components/schemas/Timestamp' }
        updatedAt: { $ref: './common.yaml#/components/schemas/Timestamp' }
    CreateOperator:
      type: object
      required: [name, legalName, contactEmail, verticals]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        legalName: { type: string, minLength: 1, maxLength: 200 }
        contactEmail: { $ref: './common.yaml#/components/schemas/Email' }
        contactPhone: { $ref: './common.yaml#/components/schemas/PhoneE164' }
        verticals:
          type: array
          uniqueItems: true
          minItems: 1
          items: { $ref: '#/components/schemas/Vertical' }
    UpdateOperator:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        legalName: { type: string, minLength: 1, maxLength: 200 }
        contactEmail: { $ref: './common.yaml#/components/schemas/Email' }
        contactPhone: { $ref: './common.yaml#/components/schemas/PhoneE164' }
        verticals:
          type: array
          uniqueItems: true
          minItems: 1
          items: { $ref: '#/components/schemas/Vertical' }
        status: { $ref: '#/components/schemas/OperatorStatus' }

    # --------------------------------------------------------------- movies --
    Movie:
      type: object
      required: [id, title, durationMinutes, languages, genres, createdAt, updatedAt]
      properties:
        id: { $ref: './common.yaml#/components/schemas/Id' }
        title: { type: string }
        description: { type: string }
        durationMinutes: { type: integer, minimum: 1, maximum: 600 }
        languages: { type: array, items: { type: string } }
        genres: { type: array, items: { type: string } }
        certificate: { type: string, enum: [U, UA, A, S] }
        posterUrl: { type: string, format: uri }
        releaseDate: { type: string, format: date }
        version: { type: integer, readOnly: true }
        createdAt: { $ref: './common.yaml#/components/schemas/Timestamp' }
        updatedAt: { $ref: './common.yaml#/components/schemas/Timestamp' }
    CreateMovie:
      type: object
      required: [title, durationMinutes, languages]
      additionalProperties: false
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        description: { type: string, maxLength: 4000 }
        durationMinutes: { type: integer, minimum: 1, maximum: 600 }
        languages: { type: array, minItems: 1, items: { type: string } }
        genres: { type: array, items: { type: string } }
        certificate: { type: string, enum: [U, UA, A, S] }
        posterUrl: { type: string, format: uri }
        releaseDate: { type: string, format: date }
    UpdateMovie:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        description: { type: string, maxLength: 4000 }
        durationMinutes: { type: integer, minimum: 1, maximum: 600 }
        languages: { type: array, minItems: 1, items: { type: string } }
        genres: { type: array, items: { type: string } }
        certificate: { type: string, enum: [U, UA, A, S] }
        posterUrl: { type: string, format: uri }
        releaseDate: { type: string, format: date }

    # ------------------------------------------------------ venues/screens --
    Venue:
      type: object
      required: [id, operatorId, name, address, timezone, version, createdAt, updatedAt]
      properties:
        id: { $ref: './common.yaml#/components/schemas/Id' }
        operatorId: { $ref: './common.yaml#/components/schemas/Id' }
        name: { type: string }
        address: { $ref: '#/components/schemas/Address' }
        location: { $ref: '#/components/schemas/GeoPoint' }
        timezone: { $ref: '#/components/schemas/Timezone' }
        version: { type: integer, readOnly: true }
        createdAt: { $ref: './common.yaml#/components/schemas/Timestamp' }
        updatedAt: { $ref: './common.yaml#/components/schemas/Timestamp' }
    CreateVenue:
      type: object
      required: [name, address, timezone]
      additionalProperties: false
      properties:
        operatorId:
          $ref: './common.yaml#/components/schemas/Id'
          description: Required for admins (`operator-required`); ignored or must match the tenant for operators.
        name: { type: string, minLength: 1, maxLength: 150 }
        address: { $ref: '#/components/schemas/Address' }
        location: { $ref: '#/components/schemas/GeoPoint' }
        timezone: { $ref: '#/components/schemas/Timezone' }
    UpdateVenue:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: { type: string, minLength: 1, maxLength: 150 }
        address: { $ref: '#/components/schemas/Address' }
        location: { $ref: '#/components/schemas/GeoPoint' }
        timezone: { $ref: '#/components/schemas/Timezone' }
    Screen:
      type: object
      required: [id, venueId, name, seatLayout, seatCount, version, createdAt, updatedAt]
      properties:
        id: { $ref: './common.yaml#/components/schemas/Id' }
        venueId: { $ref: './common.yaml#/components/schemas/Id' }
        name: { type: string }
        seatLayout: { $ref: '#/components/schemas/SeatLayout' }
        seatCount: { type: integer, readOnly: true }
        version: { type: integer, readOnly: true }
        createdAt: { $ref: './common.yaml#/components/schemas/Timestamp' }
        updatedAt: { $ref: './common.yaml#/components/schemas/Timestamp' }
    CreateScreen:
      type: object
      required: [name, seatLayout]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        seatLayout: { $ref: '#/components/schemas/SeatLayout' }
    UpdateScreen:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        seatLayout: { $ref: '#/components/schemas/SeatLayout' }

    # ------------------------------------------------- stations & routes ----
    Station:
      type: object
      required: [id, code, name, city, state, timezone, modes, version, createdAt, updatedAt]
      properties:
        id: { $ref: './common.yaml#/components/schemas/Id' }
        code: { type: string, pattern: '^[A-Z0-9]{2,8}$' }
        name: { type: string }
        city: { type: string }
        state: { type: string }
        timezone: { $ref: '#/components/schemas/Timezone' }
        location: { $ref: '#/components/schemas/GeoPoint' }
        modes:
          type: array
          uniqueItems: true
          minItems: 1
          items: { $ref: '#/components/schemas/TransportMode' }
        version: { type: integer, readOnly: true }
        createdAt: { $ref: './common.yaml#/components/schemas/Timestamp' }
        updatedAt: { $ref: './common.yaml#/components/schemas/Timestamp' }
    CreateStation:
      type: object
      required: [code, name, city, state, timezone, modes]
      additionalProperties: false
      properties:
        code: { type: string, pattern: '^[A-Z0-9]{2,8}$' }
        name: { type: string, minLength: 1, maxLength: 150 }
        city: { type: string, minLength: 1, maxLength: 100 }
        state: { type: string, minLength: 1, maxLength: 100 }
        timezone: { $ref: '#/components/schemas/Timezone' }
        location: { $ref: '#/components/schemas/GeoPoint' }
        modes:
          type: array
          uniqueItems: true
          minItems: 1
          items: { $ref: '#/components/schemas/TransportMode' }
    UpdateStation:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: { type: string, minLength: 1, maxLength: 150 }
        city: { type: string, minLength: 1, maxLength: 100 }
        state: { type: string, minLength: 1, maxLength: 100 }
        timezone: { $ref: '#/components/schemas/Timezone' }
        location: { $ref: '#/components/schemas/GeoPoint' }
        modes:
          type: array
          uniqueItems: true
          minItems: 1
          items: { $ref: '#/components/schemas/TransportMode' }
    StopPoint:
      type: object
      description: |
        A boarding or dropping point within a bus stop (chosen by the passenger
        at booking). It has no timezone of its own: its time is shown in the
        timezone of the stop's `Station` (ADR-0012).
      required: [name, offsetMinutes]
      properties:
        id: { $ref: './common.yaml#/components/schemas/Id', readOnly: true }
        name: { type: string, maxLength: 150 }
        address: { type: string, maxLength: 300 }
        offsetMinutes:
          type: integer
          description: Minutes after the stop's scheduled time at which the bus reaches this point (may be negative).
    RouteStop:
      type: object
      description: |
        A station on a route. Offsets are minutes from the schedule's origin
        departure; the stop's local time is shown in its `Station` timezone
        (ADR-0012).
      required: [stationId, sequence, distanceKm]
      properties:
        stationId: { $ref: './common.yaml#/components/schemas/Id' }
        sequence: { type: integer, minimum: 0, description: 'Strictly increasing from 0.' }
        arrivalOffsetMinutes:
          type: [integer, 'null']
          minimum: 0
          description: Minutes from origin departure. `null` at the origin.
        departureOffsetMinutes:
          type: [integer, 'null']
          minimum: 0
          description: Minutes from origin departure. `null` at the final stop.
        distanceKm: { type: number, minimum: 0, description: Cumulative distance from the origin. }
        boardingPoints:
          type: array
          items: { $ref: '#/components/schemas/StopPoint' }
          description: Bus routes only.
        droppingPoints:
          type: array
          items: { $ref: '#/components/schemas/StopPoint' }
          description: Bus routes only.
    Route:
      type: object
      required: [id, operatorId, mode, name, stops, version, createdAt, updatedAt]
      properties:
        id: { $ref: './common.yaml#/components/schemas/Id' }
        operatorId: { $ref: './common.yaml#/components/schemas/Id' }
        mode: { $ref: '#/components/schemas/TransportMode' }
        name: { type: string }
        stops:
          type: array
          minItems: 2
          items: { $ref: '#/components/schemas/RouteStop' }
        version: { type: integer, readOnly: true }
        createdAt: { $ref: './common.yaml#/components/schemas/Timestamp' }
        updatedAt: { $ref: './common.yaml#/components/schemas/Timestamp' }
    CreateRoute:
      type: object
      required: [mode, name, stops]
      additionalProperties: false
      properties:
        operatorId:
          $ref: './common.yaml#/components/schemas/Id'
          description: Required for admins (`operator-required`).
        mode: { $ref: '#/components/schemas/TransportMode' }
        name: { type: string, minLength: 1, maxLength: 150 }
        stops:
          type: array
          minItems: 2
          items: { $ref: '#/components/schemas/RouteStop' }
    UpdateRoute:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: { type: string, minLength: 1, maxLength: 150 }
        stops:
          type: array
          minItems: 2
          items: { $ref: '#/components/schemas/RouteStop' }

    # ------------------------------------------------------ buses & trains --
    BusLayout:
      type: object
      required: [id, operatorId, name, seatLayout, seatCount, version, createdAt, updatedAt]
      properties:
        id: { $ref: './common.yaml#/components/schemas/Id' }
        operatorId: { $ref: './common.yaml#/components/schemas/Id' }
        name: { type: string }
        amenities: { type: array, items: { type: string }, examples: [[AC, 'Charging point']] }
        seatLayout: { $ref: '#/components/schemas/SeatLayout' }
        seatCount: { type: integer, readOnly: true }
        version: { type: integer, readOnly: true }
        createdAt: { $ref: './common.yaml#/components/schemas/Timestamp' }
        updatedAt: { $ref: './common.yaml#/components/schemas/Timestamp' }
    CreateBusLayout:
      type: object
      required: [name, seatLayout]
      additionalProperties: false
      properties:
        operatorId:
          $ref: './common.yaml#/components/schemas/Id'
          description: Required for admins (`operator-required`).
        name: { type: string, minLength: 1, maxLength: 120 }
        amenities: { type: array, items: { type: string } }
        seatLayout: { $ref: '#/components/schemas/SeatLayout' }
    UpdateBusLayout:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        amenities: { type: array, items: { type: string } }
        seatLayout: { $ref: '#/components/schemas/SeatLayout' }
    CoachLayout:
      type: object
      required: [id, name, classCode, seatLayout, seatCount, version, createdAt, updatedAt]
      properties:
        id: { $ref: './common.yaml#/components/schemas/Id' }
        operatorId:
          oneOf:
            - $ref: './common.yaml#/components/schemas/Id'
            - type: 'null'
          description: '`null` for platform-wide layouts available to every operator.'
        name: { type: string }
        classCode: { $ref: '#/components/schemas/ClassCode' }
        seatLayout: { $ref: '#/components/schemas/SeatLayout' }
        seatCount: { type: integer, readOnly: true }
        version: { type: integer, readOnly: true }
        createdAt: { $ref: './common.yaml#/components/schemas/Timestamp' }
        updatedAt: { $ref: './common.yaml#/components/schemas/Timestamp' }
    CreateCoachLayout:
      type: object
      required: [name, classCode, seatLayout]
      additionalProperties: false
      properties:
        operatorId:
          oneOf:
            - $ref: './common.yaml#/components/schemas/Id'
            - type: 'null'
          description: Admins may pass `null` to create a platform-wide layout.
        name: { type: string, minLength: 1, maxLength: 120 }
        classCode: { $ref: '#/components/schemas/ClassCode' }
        seatLayout: { $ref: '#/components/schemas/SeatLayout' }
    UpdateCoachLayout:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        classCode: { $ref: '#/components/schemas/ClassCode' }
        seatLayout: { $ref: '#/components/schemas/SeatLayout' }
    Coach:
      type: object
      required: [coachNumber, classCode, coachLayoutId]
      properties:
        coachNumber: { type: string, maxLength: 4, examples: [S1, B2, A1] }
        classCode: { $ref: '#/components/schemas/ClassCode' }
        coachLayoutId: { $ref: './common.yaml#/components/schemas/Id' }
    Train:
      type: object
      required: [id, operatorId, number, name, routeId, coaches, status, version, createdAt, updatedAt]
      properties:
        id: { $ref: './common.yaml#/components/schemas/Id' }
        operatorId: { $ref: './common.yaml#/components/schemas/Id' }
        number: { type: string, pattern: '^[0-9A-Z]{3,8}$' }
        name: { type: string }
        routeId: { $ref: './common.yaml#/components/schemas/Id' }
        coaches:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/Coach' }
        status: { type: string, enum: [ACTIVE, INACTIVE] }
        version: { type: integer, readOnly: true }
        createdAt: { $ref: './common.yaml#/components/schemas/Timestamp' }
        updatedAt: { $ref: './common.yaml#/components/schemas/Timestamp' }
    CreateTrain:
      type: object
      required: [number, name, routeId, coaches]
      additionalProperties: false
      properties:
        operatorId:
          $ref: './common.yaml#/components/schemas/Id'
          description: Required for admins (`operator-required`).
        number: { type: string, pattern: '^[0-9A-Z]{3,8}$' }
        name: { type: string, minLength: 1, maxLength: 150 }
        routeId:
          $ref: './common.yaml#/components/schemas/Id'
          description: 'Must reference a route with `mode: TRAIN`.'
        coaches:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/Coach' }
    UpdateTrain:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: { type: string, minLength: 1, maxLength: 150 }
        routeId: { $ref: './common.yaml#/components/schemas/Id' }
        coaches:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/Coach' }
        status: { type: string, enum: [ACTIVE, INACTIVE] }

    # ------------------------------------------------------------ schedules --
    ScheduleStatus:
      type: string
      enum: [DRAFT, PUBLISHED, CANCELLED, COMPLETED]
    Availability:
      type: object
      description: |
        Best-effort seat counts from the booking service, cached for 5-10 seconds.
        `null` on the parent when the booking service is unreachable; never block
        the page on it.
      required: [seatsTotal, seatsAvailable, asOf]
      properties:
        seatsTotal: { type: integer, minimum: 0 }
        seatsAvailable: { type: integer, minimum: 0 }
        asOf: { $ref: './common.yaml#/components/schemas/Timestamp' }
    ScheduleCommon:
      type: object
      required: [id, vertical, operator, status, startsAt, timezone, version, createdAt, updatedAt]
      properties:
        id: { $ref: './common.yaml#/components/schemas/Id' }
        vertical: { $ref: '#/components/schemas/Vertical' }
        operator: { $ref: '#/components/schemas/OperatorSummary' }
        status: { $ref: '#/components/schemas/ScheduleStatus' }
        startsAt:
          $ref: './common.yaml#/components/schemas/Timestamp'
          description: Show start, bus departure from origin, or train departure from origin.
        endsAt:
          oneOf:
            - $ref: './common.yaml#/components/schemas/Timestamp'
            - type: 'null'
          readOnly: true
          description: Derived from the movie duration or the route's last stop.
        timezone:
          $ref: '#/components/schemas/Timezone'
          description: |
            Origin zone: the venue or origin station. Used to display `startsAt`
            and by the search `date` filter. Times at later stops use their own
            station's zone (ADR-0012).
        cancellationPolicy:
          $ref: '#/components/schemas/CancellationPolicy'
          readOnly: true
          description: Policy frozen at publish time. Absent on drafts.
        convenienceFeeBasisPoints:
          type: integer
          readOnly: true
          description: Fee frozen at publish time. Absent on drafts.
        availability:
          oneOf:
            - $ref: '#/components/schemas/Availability'
            - type: 'null'
          readOnly: true
        publishedAt: { $ref: './common.yaml#/components/schemas/Timestamp', readOnly: true }
        cancelledAt: { $ref: './common.yaml#/components/schemas/Timestamp', readOnly: true }
        cancellationReason: { type: string, readOnly: true }
        version: { type: integer, readOnly: true }
        createdAt: { $ref: './common.yaml#/components/schemas/Timestamp' }
        updatedAt: { $ref: './common.yaml#/components/schemas/Timestamp' }
    MovieShow:
      allOf:
        - $ref: '#/components/schemas/ScheduleCommon'
        - type: object
          required: [movie, screenId, venueId, language, format, price]
          properties:
            vertical: { const: MOVIE }
            movie:
              type: object
              required: [id, title]
              properties:
                id: { $ref: './common.yaml#/components/schemas/Id' }
                title: { type: string }
                posterUrl: { type: string, format: uri }
            venueId: { $ref: './common.yaml#/components/schemas/Id' }
            screenId: { $ref: './common.yaml#/components/schemas/Id' }
            language: { type: string }
            format: { $ref: '#/components/schemas/ShowFormat' }
            price:
              $ref: './common.yaml#/components/schemas/Money'
              description: One price for every seat in the MVP.
    BusTrip:
      allOf:
        - $ref: '#/components/schemas/ScheduleCommon'
        - type: object
          required: [routeId, busLayoutId, fares]
          properties:
            vertical: { const: BUS }
            routeId: { $ref: './common.yaml#/components/schemas/Id' }
            busLayoutId: { $ref: './common.yaml#/components/schemas/Id' }
            registration: { type: string, maxLength: 20, description: Vehicle registration number. }
            fares:
              type: array
              minItems: 1
              items: { $ref: '#/components/schemas/BusFare' }
    TrainRun:
      allOf:
        - $ref: '#/components/schemas/ScheduleCommon'
        - type: object
          required: [trainId, routeId, fareTable]
          properties:
            vertical: { const: TRAIN }
            trainId: { $ref: './common.yaml#/components/schemas/Id' }
            routeId: { $ref: './common.yaml#/components/schemas/Id' }
            fareTable:
              type: array
              minItems: 1
              items: { $ref: '#/components/schemas/TrainFare' }
    Schedule:
      oneOf:
        - $ref: '#/components/schemas/MovieShow'
        - $ref: '#/components/schemas/BusTrip'
        - $ref: '#/components/schemas/TrainRun'
      discriminator:
        propertyName: vertical
        mapping:
          MOVIE: '#/components/schemas/MovieShow'
          BUS: '#/components/schemas/BusTrip'
          TRAIN: '#/components/schemas/TrainRun'
    ShowFormat:
      type: string
      enum: [TWO_D, THREE_D, IMAX]
    BusFare:
      type: object
      required: [seatType, price]
      properties:
        seatType: { $ref: '#/components/schemas/SeatType' }
        price: { $ref: './common.yaml#/components/schemas/Money' }
    TrainFare:
      type: object
      description: Fare for one class between two stations of the route (`from` must precede `to`).
      required: [classCode, fromStationId, toStationId, price]
      properties:
        classCode: { $ref: '#/components/schemas/ClassCode' }
        fromStationId: { $ref: './common.yaml#/components/schemas/Id' }
        toStationId: { $ref: './common.yaml#/components/schemas/Id' }
        price: { $ref: './common.yaml#/components/schemas/Money' }

    CreateMovieShow:
      type: object
      required: [vertical, movieId, screenId, startsAt, language, format, price]
      additionalProperties: false
      properties:
        vertical: { const: MOVIE }
        movieId: { $ref: './common.yaml#/components/schemas/Id' }
        screenId: { $ref: './common.yaml#/components/schemas/Id' }
        startsAt: { $ref: './common.yaml#/components/schemas/Timestamp' }
        language: { type: string }
        format: { $ref: '#/components/schemas/ShowFormat' }
        price: { $ref: './common.yaml#/components/schemas/Money' }
    CreateBusTrip:
      type: object
      required: [vertical, routeId, busLayoutId, startsAt, fares]
      additionalProperties: false
      properties:
        vertical: { const: BUS }
        routeId: { $ref: './common.yaml#/components/schemas/Id' }
        busLayoutId: { $ref: './common.yaml#/components/schemas/Id' }
        registration: { type: string, maxLength: 20 }
        startsAt: { $ref: './common.yaml#/components/schemas/Timestamp' }
        fares:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/BusFare' }
    CreateTrainRun:
      type: object
      required: [vertical, trainId, startsAt, fareTable]
      additionalProperties: false
      properties:
        vertical: { const: TRAIN }
        trainId: { $ref: './common.yaml#/components/schemas/Id' }
        startsAt: { $ref: './common.yaml#/components/schemas/Timestamp' }
        fareTable:
          type: array
          minItems: 1
          description: Must cover every class on the train and every ordered station pair of its route, otherwise `incomplete-fare-table`.
          items: { $ref: '#/components/schemas/TrainFare' }
    CreateSchedule:
      oneOf:
        - $ref: '#/components/schemas/CreateMovieShow'
        - $ref: '#/components/schemas/CreateBusTrip'
        - $ref: '#/components/schemas/CreateTrainRun'
      discriminator:
        propertyName: vertical
        mapping:
          MOVIE: '#/components/schemas/CreateMovieShow'
          BUS: '#/components/schemas/CreateBusTrip'
          TRAIN: '#/components/schemas/CreateTrainRun'
    UpdateSchedule:
      type: object
      description: Fields not valid for the schedule's vertical answer `422`.
      additionalProperties: false
      minProperties: 1
      properties:
        startsAt: { $ref: './common.yaml#/components/schemas/Timestamp' }
        language: { type: string }
        format: { $ref: '#/components/schemas/ShowFormat' }
        price: { $ref: './common.yaml#/components/schemas/Money' }
        registration: { type: string, maxLength: 20 }
        fares:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/BusFare' }
        fareTable:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/TrainFare' }
    CancelScheduleRequest:
      type: object
      required: [reason]
      additionalProperties: false
      properties:
        reason:
          type: string
          minLength: 3
          maxLength: 500
          description: Included in the notification sent to every affected customer.
    ScheduleSeatLayout:
      type: object
      required: [scheduleId, vertical, layouts]
      properties:
        scheduleId: { $ref: './common.yaml#/components/schemas/Id' }
        vertical: { $ref: '#/components/schemas/Vertical' }
        layouts:
          type: array
          minItems: 1
          items:
            type: object
            required: [seatLayout]
            properties:
              coachNumber:
                type: [string, 'null']
                description: Set for train runs; `null` otherwise.
              classCode:
                oneOf:
                  - $ref: '#/components/schemas/ClassCode'
                  - type: 'null'
              seatLayout: { $ref: '#/components/schemas/SeatLayout' }

    # --------------------------------------------------- policy & fee -------
    PolicyScope:
      type: string
      enum: [PLATFORM, OPERATOR]
    PolicyTier:
      type: object
      description: |
        The first tier (in descending `minHoursBeforeStart`) whose threshold is
        less than or equal to the hours remaining applies.
      required: [minHoursBeforeStart, refundBasisPoints]
      properties:
        minHoursBeforeStart: { type: integer, minimum: 0 }
        refundBasisPoints:
          type: integer
          minimum: 0
          maximum: 10000
          description: Share of the ticket subtotal refunded (10000 = 100%). The convenience fee is not refundable on customer cancellations.
        flatFeeMinor:
          type: integer
          minimum: 0
          default: 0
          description: Flat per-passenger deduction (used for trains).
    CancellationPolicy:
      type: object
      required: [id, scope, vertical, version, tiers, effectiveFrom, status, createdAt]
      properties:
        id: { $ref: './common.yaml#/components/schemas/Id' }
        scope: { $ref: '#/components/schemas/PolicyScope' }
        operatorId:
          oneOf:
            - $ref: './common.yaml#/components/schemas/Id'
            - type: 'null'
          description: '`null` for the platform default.'
        vertical: { $ref: '#/components/schemas/Vertical' }
        version: { type: integer, minimum: 1 }
        tiers:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/PolicyTier' }
        effectiveFrom: { $ref: './common.yaml#/components/schemas/Timestamp' }
        status: { type: string, enum: [ACTIVE, SUPERSEDED] }
        createdAt: { $ref: './common.yaml#/components/schemas/Timestamp' }
        createdBy: { $ref: './common.yaml#/components/schemas/Id' }
    CreateCancellationPolicy:
      type: object
      required: [vertical, tiers]
      additionalProperties: false
      properties:
        operatorId:
          oneOf:
            - $ref: './common.yaml#/components/schemas/Id'
            - type: 'null'
          description: Omit or `null` for the platform default.
        vertical: { $ref: '#/components/schemas/Vertical' }
        tiers:
          type: array
          minItems: 1
          description: Strictly descending `minHoursBeforeStart`; the last must be `0`, otherwise `invalid-policy-tiers`.
          items: { $ref: '#/components/schemas/PolicyTier' }
        effectiveFrom:
          $ref: './common.yaml#/components/schemas/Timestamp'
          description: Defaults to now. Must not be in the past by more than a minute.
    FeeConfig:
      type: object
      required: [convenienceFeeBasisPoints, version, updatedAt]
      properties:
        convenienceFeeBasisPoints:
          type: integer
          minimum: 0
          maximum: 2000
          description: Percentage of the ticket subtotal in basis points (300 = 3%).
        version: { type: integer, readOnly: true }
        updatedAt: { $ref: './common.yaml#/components/schemas/Timestamp' }
    UpdateFeeConfig:
      type: object
      required: [convenienceFeeBasisPoints]
      additionalProperties: false
      properties:
        convenienceFeeBasisPoints: { type: integer, minimum: 0, maximum: 2000 }

    # --------------------------------------------------------------- search --
    MovieHit:
      type: object
      required: [kind, movie]
      properties:
        kind: { const: MOVIE }
        movie: { $ref: '#/components/schemas/Movie' }
    ScheduleHit:
      type: object
