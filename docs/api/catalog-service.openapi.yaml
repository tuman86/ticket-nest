openapi: 3.1.0
info:
  title: TicketNest Catalog Service API
  version: 1.0.0
  summary: Operators, venues, movies, routes, trains, schedules, cancellation policy, and search.
  description: |
    Public API of the **catalog service**. It owns the *definition* of what can be
    booked (operators, venues and screens, bus and coach layouts, stations,
    routes, trains, movies, schedules, prices) plus cancellation policy and fee
    configuration, and serves search. It does **not** own seat availability or
    bookings; those belong to the booking service.

    ## Conventions
    Shared conventions (errors, pagination, headers, tracing) are defined in
    [`common.yaml`](./common.yaml): `/v1` versioning, camelCase JSON,
    RFC 9457 `application/problem+json`, cursor pagination (`limit` + `cursor`
    returning `{ data, page }`), `PATCH` as JSON Merge Patch, and optional
    `If-Match` / `ETag`. Money is `{ amountMinor, currency }` in cents (USD).
    Timestamps are UTC; `timezone` fields carry the IANA zone to display them in.

    ## Access model
    * **Public reads** (no token needed): movies, venues, screens, stations,
      routes, trains, published schedules, search, cancellation policies. Marked
      with optional auth; a staff token widens what is returned.
    * **Staff writes** need a permission (see `x-permissions` on each operation; when
      several keys are listed, holding any one of them is enough). Operations marked
      `x-recent-login: true` also need a password login within the last 5 minutes and
      answer `reauthentication-required` (401) otherwise (ADR-0025).
    * **Tenancy:** operator users act only on resources whose `operatorId`
      equals the `tenantId` claim of their token. Other tenants' resources answer
      `404`. Admins act on any tenant and must pass `operatorId` when creating
      operator-owned resources. The scope comes from the verified token only:
      `public` (anonymous or customer: published, unstarted schedules and public
      fields), `tenant` (the token has `tenantId`; a caller's `operatorId` filter
      is overridden by it) or `all` (no `tenantId` and the permission the
      operation requires; `operatorId` is an ordinary filter). Movies and
      stations are not tenant-owned. Platform-default cancellation policies have a
      `null` `operatorId` and are readable by everyone (see ADR-0015).

    ## Schedules
    A *schedule* is one sellable occurrence, with a `vertical` discriminator:
    `MOVIE` (a show), `BUS` (a trip) or `TRAIN` (a run). Lifecycle:

    `DRAFT -> PUBLISHED -> CANCELLED | COMPLETED`

    * Publishing emits `schedule.published`; the booking service then
      materialises seat inventory. Cancelling emits `schedule.cancelled`; the
      booking service refunds every confirmed booking in full (including fees)
      **asynchronously**, so the `200` response does not mean refunds finished.
    * Prices are fixed once a schedule has bookings (`schedule-has-bookings`).
    * Event contracts live in `packages/contracts`, not in this document.

    ## Domain problem types
    | type (suffix)              | status | meaning |
    |----------------------------|--------|---------|
    | `schedule-has-bookings`    | 409 | schedule already has claims or bookings; field cannot change / cannot be deleted |
    | `invalid-state-transition` | 409 | e.g. publishing a cancelled schedule |
    | `overlapping-schedule`     | 409 | same screen or vehicle already scheduled in that window |
    | `resource-in-use`          | 409 | referenced by a schedule or another resource |
    | `duplicate-resource`       | 409 | unique key already taken (station code, train number, ...) |
    | `incomplete-fare-table`    | 422 | train run fare table misses a class or station pair |
    | `invalid-layout`           | 422 | seat ids not unique or positions outside the grid |
    | `invalid-policy-tiers`     | 422 | tiers not strictly descending or last tier is not 0 hours |
    | `reauthentication-required` | 401 | the operation needs a password login within the last 5 minutes |
    | `operator-required`        | 422 | admin created an operator-owned resource without `operatorId` |
    | `schedule-in-past`         | 422 | start is before the sales cutoff (`SALES_CUTOFF_MINUTES`: movies 15, buses 60, trains 240; ADR-0012) |
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary

servers:
  - url: https://api.ticketnest.example
    description: Production (via api-gateway)
  - url: https://api.staging.ticketnest.example
    description: Staging
  - url: http://localhost:4000
    description: Local (docker compose, via api-gateway)

tags:
  - name: Search
    description: Cross-vertical search for customers.
  - name: Schedules
    description: Shows, bus trips and train runs.
  - name: Movies
    description: Shared, admin-curated movie catalogue (not tenant-owned).
  - name: Venues and screens
    description: Cinemas and their screens with seat layouts.
  - name: Stations and routes
    description: Stations, bus stops, and ordered routes.
  - name: Buses and trains
    description: Seat layouts and train definitions.
  - name: Operators
    description: Tenant onboarding (admin).
  - name: Policy and fees
    description: Cancellation policies and the convenience fee.
  - name: Operations
    description: Liveness and readiness probes.

security:
  - bearerAuth: []

paths:
  /healthz:
    get:
      tags: [Operations]
      operationId: getLiveness
      summary: Liveness probe
      security: []
      responses:
        '200':
          description: Process is alive.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, enum: [ok] }

  /readyz:
    get:
      tags: [Operations]
      operationId: getReadiness
      summary: Readiness probe
      description: Checks the database and broker. Used by Kubernetes.
      security: []
      responses:
        '200':
          description: Ready to serve traffic.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, enum: [ok] }
        '503': { $ref: './common.yaml#/components/responses/ServiceUnavailable' }

  # -------------------------------------------------------------- search ---
  /v1/search:
    get:
      tags: [Search]
      operationId: search
      summary: Cross-vertical search
      description: |
        Free-text and filtered search across movies and published schedules.
        Filters are Postgres-backed in the MVP. Results are ordered by relevance
        for `q`, otherwise by `startsAt` ascending; the cursor is valid only for
        the same query. `availability` on schedule hits is best effort and may be
        `null`.
      security: [{}, { bearerAuth: [] }]
      parameters:
        - $ref: './common.yaml#/components/parameters/Limit'
        - $ref: './common.yaml#/components/parameters/Cursor'
        - name: q
          in: query
          description: Text matched against movie titles, station and city names, train numbers and names.
          schema: { type: string, minLength: 2, maxLength: 100 }
        - name: vertical
          in: query
          description: Restrict to these verticals. Repeat the parameter for several.
          style: form
          explode: true
          schema:
            type: array
            items: { $ref: '#/components/schemas/Vertical' }
        - $ref: '#/components/parameters/City'
        - $ref: '#/components/parameters/FromStationId'
        - $ref: '#/components/parameters/ToStationId'
        - $ref: '#/components/parameters/Date'
        - $ref: '#/components/parameters/MovieIdFilter'
        - $ref: '#/components/parameters/OperatorIdFilter'
        - $ref: '#/components/parameters/ClassCode'
        - $ref: '#/components/parameters/PriceMinMinor'
        - $ref: '#/components/parameters/PriceMaxMinor'
      responses:
        '200':
          description: A page of hits.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SearchResultList' }
        '400': { $ref: './common.yaml#/components/responses/BadRequest' }
        '422': { $ref: './common.yaml#/components/responses/ValidationError' }
        '429': { $ref: './common.yaml#/components/responses/TooManyRequests' }
        '500': { $ref: './common.yaml#/components/responses/InternalError' }

  # ----------------------------------------------------------- schedules ---
  /v1/schedules:
    get:
      tags: [Schedules]
      operationId: listSchedules
      summary: List schedules
      description: |
        Anonymous and customer callers receive only `PUBLISHED` schedules that
        have not started. Staff with `schedule:read` also see drafts and past or
        cancelled schedules of their tenant (admins: all) and may use `status`.
        Ordered by `startsAt` ascending, then `id`.
      security: [{}, { bearerAuth: [] }]
      x-permissions: ['schedule:read']
      parameters:
        - $ref: './common.yaml#/components/parameters/Limit'
        - $ref: './common.yaml#/components/parameters/Cursor'
        - name: vertical
          in: query
          schema: { $ref: '#/components/schemas/Vertical' }
        - name: status
          in: query
          description: Staff only; ignored for anonymous callers.
          schema: { $ref: '#/components/schemas/ScheduleStatus' }
        - $ref: '#/components/parameters/OperatorIdFilter'
        - $ref: '#/components/parameters/MovieIdFilter'
        - name: venueId
          in: query
          schema: { $ref: './common.yaml#/components/schemas/Id' }
        - name: screenId
          in: query
          schema: { $ref: './common.yaml#/components/schemas/Id' }
        - name: routeId
          in: query
          schema: { $ref: './common.yaml#/components/schemas/Id' }
        - name: trainId
          in: query
          schema: { $ref: './common.yaml#/components/schemas/Id' }
        - $ref: '#/components/parameters/City'
        - $ref: '#/components/parameters/FromStationId'
        - $ref: '#/components/parameters/ToStationId'
        - $ref: '#/components/parameters/Date'
        - name: startsAfter
          in: query
          schema: { $ref: './common.yaml#/components/schemas/Timestamp' }
        - name: startsBefore
          in: query
          schema: { $ref: './common.yaml#/components/schemas/Timestamp' }
        - $ref: '#/components/parameters/ClassCode'
        - $ref: '#/components/parameters/PriceMinMinor'
        - $ref: '#/components/parameters/PriceMaxMinor'
      responses:
        '200':
          description: A page of schedules.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScheduleList' }
        '400': { $ref: './common.yaml#/components/responses/BadRequest' }
        '401': { $ref: './common.yaml#/components/responses/Unauthorized' }
        '422': { $ref: './common.yaml#/components/responses/ValidationError' }
        '500': { $ref: './common.yaml#/components/responses/InternalError' }
    post:
      tags: [Schedules]
      operationId: createSchedule
      summary: Create a schedule (draft)
      description: |
        Creates a `DRAFT`. The body is discriminated by `vertical`. Nothing is
        sellable until it is published.
      x-permissions: ['schedule:manage']
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateSchedule' }
            examples:
              movieShow:
                summary: Movie show
                value:
                  vertical: MOVIE
                  movieId: 6a1d0c52-2a4e-4a50-8a0a-1f0a2b3c4d5e
                  screenId: 9b2e1d63-3b5f-4b61-9b1b-2a1b3c4d5e6f
                  startsAt: '2026-11-14T13:30:00Z'
                  language: Hindi
                  format: TWO_D
                  price: { amountMinor: 2500, currency: USD }
      responses:
        '201':
          description: Draft created.
          headers:
            Location: { $ref: './common.yaml#/components/headers/Location' }
            ETag: { $ref: './common.yaml#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Schedule' }
        '400': { $ref: './common.yaml#/components/responses/BadRequest' }
        '401': { $ref: './common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './common.yaml#/components/responses/Forbidden' }
        '404':
          description: A referenced screen, route, layout, train or movie does not exist for this tenant.
          content:
            application/problem+json:
              schema: { $ref: './common.yaml#/components/schemas/Problem' }
        '409':
          description: '`overlapping-schedule`.'
          content:
            application/problem+json:
              schema: { $ref: './common.yaml#/components/schemas/Problem' }
        '422':
          description: Validation error, including `incomplete-fare-table`, `schedule-in-past`, `operator-required`.
          content:
            application/problem+json:
              schema: { $ref: './common.yaml#/components/schemas/ValidationProblem' }
        '500': { $ref: './common.yaml#/components/responses/InternalError' }

  /v1/schedules/{scheduleId}:
    parameters:
      - $ref: '#/components/parameters/ScheduleId'
    get:
      tags: [Schedules]
      operationId: getSchedule
      summary: Get a schedule
      description: Anonymous callers can read only `PUBLISHED` schedules; others answer `404`.
      security: [{}, { bearerAuth: [] }]
      responses:
        '200':
          description: The schedule.
          headers:
            ETag: { $ref: './common.yaml#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Schedule' }
        '401': { $ref: './common.yaml#/components/responses/Unauthorized' }
        '404': { $ref: './common.yaml#/components/responses/NotFound' }
        '500': { $ref: './common.yaml#/components/responses/InternalError' }
    patch:
      tags: [Schedules]
      operationId: updateSchedule
      summary: Update a schedule
      description: |
        Drafts can change any listed field. A `PUBLISHED` schedule with no
        bookings can change `startsAt` and prices; once it has bookings, changing
        `startsAt` or prices returns `schedule-has-bookings`. Cancelled and
        completed schedules are immutable.
      x-permissions: ['schedule:manage']
      parameters:
        - $ref: './common.yaml#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema: { $ref: '#/components/schemas/UpdateSchedule' }
      responses:
        '200':
          description: Updated schedule.
          headers:
            ETag: { $ref: './common.yaml#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Schedule' }
        '400': { $ref: './common.yaml#/components/responses/BadRequest' }
        '401': { $ref: './common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './common.yaml#/components/responses/Forbidden' }
        '404': { $ref: './common.yaml#/components/responses/NotFound' }
        '409':
          description: '`schedule-has-bookings`, `invalid-state-transition`, or `overlapping-schedule`.'
          content:
            application/problem+json:
              schema: { $ref: './common.yaml#/components/schemas/Problem' }
        '412': { $ref: './common.yaml#/components/responses/PreconditionFailed' }
        '422': { $ref: './common.yaml#/components/responses/ValidationError' }
        '500': { $ref: './common.yaml#/components/responses/InternalError' }
    delete:
      tags: [Schedules]
      operationId: deleteSchedule
      summary: Delete a draft schedule
      description: Only `DRAFT` schedules can be deleted. Use cancel for published ones.
      x-permissions: ['schedule:manage']
      parameters:
        - $ref: './common.yaml#/components/parameters/IfMatch'
      responses:
        '204': { description: Deleted. }
        '401': { $ref: './common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './common.yaml#/components/responses/Forbidden' }
        '404': { $ref: './common.yaml#/components/responses/NotFound' }
        '409': { $ref: './common.yaml#/components/responses/Conflict' }
        '412': { $ref: './common.yaml#/components/responses/PreconditionFailed' }
        '500': { $ref: './common.yaml#/components/responses/InternalError' }

  /v1/schedules/{scheduleId}/publish:
    post:
      tags: [Schedules]
      operationId: publishSchedule
      summary: Publish a draft
      description: |
        Validates the schedule (layout present, complete fares, start after the
        sales cutoff, no overlap), freezes the effective cancellation policy and
        fee onto it, and emits `schedule.published`. Idempotent: publishing an
        already published schedule returns it unchanged.
      x-permissions: ['schedule:manage']
      parameters:
        - $ref: '#/components/parameters/ScheduleId'
        - $ref: './common.yaml#/components/parameters/IfMatch'
      responses:
        '200':
          description: The published schedule.
          headers:
            ETag: { $ref: './common.yaml#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Schedule' }
        '401': { $ref: './common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './common.yaml#/components/responses/Forbidden' }
        '404': { $ref: './common.yaml#/components/responses/NotFound' }
        '409':
          description: '`invalid-state-transition` or `overlapping-schedule`.'
          content:
            application/problem+json:
              schema: { $ref: './common.yaml#/components/schemas/Problem' }
        '412': { $ref: './common.yaml#/components/responses/PreconditionFailed' }
        '422': { $ref: './common.yaml#/components/responses/ValidationError' }
        '500': { $ref: './common.yaml#/components/responses/InternalError' }

  /v1/schedules/{scheduleId}/cancel:
    post:
      tags: [Schedules]
      operationId: cancelSchedule
      summary: Cancel a show, trip or run
      description: |
        Marks the schedule `CANCELLED` and emits `schedule.cancelled`. The booking
        service then refunds **every** confirmed booking in full including fees
        and notifies the customers. That work is asynchronous: this call returns
        as soon as the schedule is cancelled. Idempotent: cancelling an already
        cancelled schedule returns it unchanged.
      x-permissions: ['schedule:cancel']
      parameters:
        - $ref: '#/components/parameters/ScheduleId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CancelScheduleRequest' }
      responses:
        '200':
          description: The cancelled schedule.
          headers:
            ETag: { $ref: './common.yaml#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Schedule' }
        '400': { $ref: './common.yaml#/components/responses/BadRequest' }
        '401': { $ref: './common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './common.yaml#/components/responses/Forbidden' }
        '404': { $ref: './common.yaml#/components/responses/NotFound' }
        '409':
          description: '`invalid-state-transition` (draft or completed schedule).'
          content:
            application/problem+json:
              schema: { $ref: './common.yaml#/components/schemas/Problem' }
        '422': { $ref: './common.yaml#/components/responses/ValidationError' }
        '500': { $ref: './common.yaml#/components/responses/InternalError' }

  /v1/schedules/{scheduleId}/seat-layout:
    get:
      tags: [Schedules]
      operationId: getScheduleSeatLayout
      summary: Seat layout(s) used by a schedule
      description: |
        The geometry needed to draw the seat map: one layout for a show or bus
        trip, one per coach for a train run. Live availability and holds come
        from the booking service; combine the two client-side.
      security: [{}, { bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/ScheduleId'
      responses:
        '200':
          description: Layout(s).
          headers:
            Cache-Control:
              schema: { type: string }
              description: Layouts are immutable per schedule; `public, max-age=3600`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScheduleSeatLayout' }
        '404': { $ref: './common.yaml#/components/responses/NotFound' }
        '500': { $ref: './common.yaml#/components/responses/InternalError' }

  # -------------------------------------------------------------- movies ---
  /v1/movies:
    get:
      tags: [Movies]
      operationId: listMovies
      summary: List movies
      description: Ordered by `releaseDate` descending, then `id`.
      security: [{}, { bearerAuth: [] }]
      parameters:
        - $ref: './common.yaml#/components/parameters/Limit'
        - $ref: './common.yaml#/components/parameters/Cursor'
        - name: q
          in: query
          description: Title prefix or word match.
          schema: { type: string, minLength: 2, maxLength: 100 }
        - name: genre
          in: query
          schema: { type: string }
        - name: language
          in: query
          schema: { type: string }
        - name: nowShowing
          in: query
          description: Only movies with at least one published, future show. Combine with `city`.
          schema: { type: boolean }
        - $ref: '#/components/parameters/City'
      responses:
        '200':
          description: A page of movies.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MovieList' }
        '400': { $ref: './common.yaml#/components/responses/BadRequest' }
        '422': { $ref: './common.yaml#/components/responses/ValidationError' }
        '500': { $ref: './common.yaml#/components/responses/InternalError' }
    post:
      tags: [Movies]
      operationId: createMovie
      summary: Create a movie
      description: |
        Movies are shared across cinemas and belong to no tenant. Only admins
        (`movie:manage`) create, edit or delete them; operators pick from the
        catalogue when creating a show (ADR-0015).
      x-permissions: ['movie:manage']
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateMovie' }
      responses:
        '201':
          description: Movie created.
          headers:
            Location: { $ref: './common.yaml#/components/headers/Location' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Movie' }
        '400': { $ref: './common.yaml#/components/responses/BadRequest' }
        '401': { $ref: './common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './common.yaml#/components/responses/Forbidden' }
        '422': { $ref: './common.yaml#/components/responses/ValidationError' }
        '500': { $ref: './common.yaml#/components/responses/InternalError' }

  /v1/movies/{movieId}:
    parameters:
      - $ref: '#/components/parameters/MovieId'
    get:
      tags: [Movies]
      operationId: getMovie
      summary: Get a movie
      security: [{}, { bearerAuth: [] }]
      responses:
        '200':
          description: The movie.
          headers:
            ETag: { $ref: './common.yaml#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Movie' }
        '404': { $ref: './common.yaml#/components/responses/NotFound' }
        '500': { $ref: './common.yaml#/components/responses/InternalError' }
    patch:
      tags: [Movies]
      operationId: updateMovie
      summary: Update a movie
      x-permissions: ['movie:manage']
      parameters:
        - $ref: './common.yaml#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema: { $ref: '#/components/schemas/UpdateMovie' }
      responses:
        '200':
          description: Updated movie.
          headers:
            ETag: { $ref: './common.yaml#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Movie' }
        '400': { $ref: './common.yaml#/components/responses/BadRequest' }
        '401': { $ref: './common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './common.yaml#/components/responses/Forbidden' }
        '404': { $ref: './common.yaml#/components/responses/NotFound' }
        '412': { $ref: './common.yaml#/components/responses/PreconditionFailed' }
        '422': { $ref: './common.yaml#/components/responses/ValidationError' }
        '500': { $ref: './common.yaml#/components/responses/InternalError' }
    delete:
      tags: [Movies]
      operationId: deleteMovie
      summary: Delete a movie
      description: Fails with `resource-in-use` if any schedule references it.
      x-permissions: ['movie:manage']
      parameters:
        - $ref: './common.yaml#/components/parameters/IfMatch'
      responses:
        '204': { description: Deleted. }
        '401': { $ref: './common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './common.yaml#/components/responses/Forbidden' }
        '404': { $ref: './common.yaml#/components/responses/NotFound' }
        '409': { $ref: './common.yaml#/components/responses/Conflict' }
        '412': { $ref: './common.yaml#/components/responses/PreconditionFailed' }
        '500': { $ref: './common.yaml#/components/responses/InternalError' }

  # ----------------------------------------------------- venues & screens ---
  /v1/venues:
    get:
      tags: [Venues and screens]
      operationId: listVenues
      summary: List cinemas (venues)
      description: Ordered by `name`, then `id`.
      security: [{}, { bearerAuth: [] }]
      parameters:
        - $ref: './common.yaml#/components/parameters/Limit'
        - $ref: './common.yaml#/components/parameters/Cursor'
        - $ref: '#/components/parameters/City'
        - $ref: '#/components/parameters/OperatorIdFilter'
      responses:
        '200':
          description: A page of venues.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VenueList' }
        '400': { $ref: './common.yaml#/components/responses/BadRequest' }
        '500': { $ref: './common.yaml#/components/responses/InternalError' }
    post:
      tags: [Venues and screens]
      operationId: createVenue
      summary: Create a venue
      x-permissions: ['inventory:create']
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateVenue' }
      responses:
        '201':
          description: Venue created.
