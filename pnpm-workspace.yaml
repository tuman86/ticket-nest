packages:
  - apps/*
  - services/*
  - packages/*

# Single source of truth for shared dependency versions.
# Workspaces reference these as "catalog:".
catalog:
  typescript: ~6.0.3 # typescript-eslint does not support TypeScript 7 yet
  eslint: ^10.14.0
  '@eslint/js': ^10.0.1
  typescript-eslint: ^8.72.1
  eslint-config-prettier: ^10.1.8
  globals: ^17.13.0
  vitest: ^5.0.5
  zod: ^4.6.7
  jose: ^6.2.15
  pino: ^10.4.0
  pino-pretty: ^13.2.0
  express: ^5.3.0
  express-rate-limit: 8.7.1 # exact on purpose: 8.7.2 and 8.7.3 are under a month old. Test-only (CodeQL recognises it).
  '@types/express': ^5.0.6
  helmet: ^8.3.0
  cors: ^2.8.6
  '@types/cors': ^2.8.19
  pg: ^8.23.1
  '@types/pg': ^8.23.1
  ioredis: ^6.0.0
  undici: 8.11.2 # exact on purpose: 8.12.x is under a month old. HTTP client of the gateway's UpstreamClient.
  supertest: ^7.3.1
  '@types/supertest': ^7.2.1
  esbuild: ^0.28.2
  tsx: ^4.23.15
  '@types/node': ^26.6.6
  prisma: ~7.10.1 # stable line; npm `latest` is an 8.0 RC
  '@prisma/client': ~7.10.1
  '@prisma/adapter-pg': ~7.10.1
  testcontainers: ^12.2.1
  '@testcontainers/postgresql': ^12.2.1

# Dependencies allowed to run install scripts. esbuild downloads its platform binary.
allowBuilds:
  esbuild: true
  # Prisma downloads its schema engine binary on install; `prisma generate` runs from there.
  prisma: true
  '@prisma/engines': true
  # Optional native add-ons pulled in by testcontainers (ssh2). The pure-JS fallbacks are enough.
  cpu-features: false
  ssh2: false
  protobufjs: false
